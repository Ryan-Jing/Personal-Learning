services:
  commonplace:
    container_name: commonplace
    build:
      context: .
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/commonplace}
    image: commonplace-learning-hub:local
    restart: unless-stopped
    init: true
    ports:
      # Loopback-only: LAN clients cannot bypass Tailscale Serve.
      - "127.0.0.1:${HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_BASE_PATH: ${APP_BASE_PATH:-/commonplace}
    healthcheck:
      test: ["CMD", "node", "-e", "const base=process.env.APP_BASE_PATH||''; const port=process.env.PORT||'3000'; fetch('http://127.0.0.1:'+port+base+'/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
